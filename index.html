<!doctype html>
<html lang="nl">
  <head>
    <meta content="text/html; charset=utf-8" http-equiv="content-type" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <script
      src="https://cdn.jsdelivr.net/gh/digitalbazaar/respec-mermaid@1.3.0/dist/main.js"
      class="remove"
    ></script>
    <script
      src="https://tools.geostandaarden.nl/respec/config/geonovum-config.js"
      class="remove"
    ></script>
    <script src="js/config.js" class="remove"></script>
    <script class="remove">
      const mergedLocalBiblio = {
        ...organisationConfig.localBiblio,
        ...respecConfig.localBiblio,
      };
      respecConfig = {
        ...organisationConfig,
        ...respecConfig,
        localBiblio: mergedLocalBiblio,
      };
    </script>

    <script class="remove">
      document.title = respecConfig.title;
    </script>

    <!-- Hier wordt het favicon gezet -->
    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="https://docs.geostandaarden.nl/media/Geonovum.ico"
    />

    <script
      src="https://gitdocumentatie.logius.nl/publicatie/respec/builds/respec-nlgov.js"
      class="remove"
      async
    ></script>

    <!-- De volgende regel zorgt ervoor dat plaatjes uit Imvertor niet geschaald
       worden, zodat de imagemap die op deze plaatjes zit werkt. -->
    <style>
      div.imageinfo img {
        max-width: none;
      }
    </style>
    <!-- Mermaid-diagrammen worden als SVG met procentuele breedte ingevoegd;
       zonder deze regel krimpt de figuur tot nul. -->
    <style>
      figure pre {
        display: block;
        width: 100%;
      }
      figure pre img {
        width: 100% !important;
        height: auto !important;
        aspect-ratio: auto !important;
      }
    </style>
  </head>

  <body>
    <section
      id="abstract"
      data-include-format="markdown"
      data-include="abstract.md"
    ></section>
    <section id="sotd"></section>
    <!-- Wordt automatisch gevuld -->

    <section
      id="inleiding"
      data-include-format="markdown"
      data-include="ch01.md"
      class="informative"
    ></section>
    <section
      id="aanpak-en-planning"
      data-include-format="markdown"
      data-include="ch02.md"
      class="informative"
    ></section>

    <!-- Voor documenten die UML diagrammen bevatten kun je de leeswijzer UML opnemen. -->
    <!-- Deze is te vinden op: https://github.com/Geonovum/mim-uml/blob/main/Bijlage_leeswijzer-MIM-UML.md -->

    <!-- Als je document een door imvertor gegenereerde catalogus bevat kan je die -->
    <!-- opnemen door de volgende regel uit commentaarhaakjes te halen en aan te passen -->
    <!-- <div id="catalogus" data-include="data/TODO-cat.respec.html" data-include-replace=true></div> -->

    <!-- De volgende paragrafen worden automatisch gevuld. -->
    <section id="tof"></section>
    <!-- Lijst van figuren -->
  </body>
</html>
